services:
  - type: web
    name: clearpath-hackatonintel
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - deploy/**
        - Dockerfile
        - .dockerignore
        - render.yaml
        - .github/workflows/clearpath.yml
    healthCheckPath: /health
    envVars:
      - key: CLEARPATH_PUBLIC_DEMO
        value: "1"
      - key: CLEARPATH_CONTROL_TOKEN
        generateValue: true
